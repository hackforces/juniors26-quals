services:
  challenge:
    build: .
    platform: linux/amd64  # эксплойт (чётные байты x86-64) рассчитан на handout
    environment:
      CTF_FLAG: ${CTF_FLAG:?Set CTF_FLAG before starting}
    ports:
      - "127.0.0.1:${PORT:-13442}:6767"       # nc — монитор шеллкода
      - "127.0.0.1:${PORT_HTTP:-13443}:31338" # http — GET /easy-shelvecode-files.zip
