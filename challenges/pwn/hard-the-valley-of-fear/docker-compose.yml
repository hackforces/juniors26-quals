services:
  challenge:
    build: .
    platform: linux/amd64  # оффсеты солвера рассчитаны на x86-64 layout attachments/valley
    environment:
      CTF_FLAG: ${CTF_FLAG:?Set CTF_FLAG before starting}
    ports:
      - "127.0.0.1:${PORT:-13426}:31337"      # nc — интерактивный челлендж
      - "127.0.0.1:${PORT_HTTP:-13440}:31338" # http — GET /hard-the-valley-of-fear-files.zip
