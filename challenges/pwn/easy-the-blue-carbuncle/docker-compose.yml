services:
  challenge:
    build: .
    platform: linux/amd64  # эксплойт рассчитан на x86-64 layout attachments/carbuncle
    environment:
      CTF_FLAG: ${CTF_FLAG:?Set CTF_FLAG before starting}
    ports:
      - "127.0.0.1:${PORT:-13425}:31337"      # nc — интерактивный челлендж
      - "127.0.0.1:${PORT_HTTP:-13439}:31338" # http — GET /easy-the-blue-carbuncle-files.zip
