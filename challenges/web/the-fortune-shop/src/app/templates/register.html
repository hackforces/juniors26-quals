{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Регистрация</h1>
    <div id="msg"></div>
    <form id="reg-form" class="card bg-body-tertiary border-secondary-subtle p-4">
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input name="username" class="form-control" minlength="3" maxlength="64" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input name="password" type="password" class="form-control" minlength="4" required autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" maxlength="255" required autocomplete="email">
        <div class="form-text">Обязательное поле. При входе потребуется код из письма.</div>
      </div>
      <button class="btn btn-primary">Создать аккаунт</button>
      <p class="mt-3 mb-0 text-secondary small">Уже есть аккаунт? <a href="/login">Вход</a></p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const email = (f.get('email') || '').trim();
  try {
    const data = await api('/api/register', 'POST', {
      username: f.get('username'),
      password: f.get('password'),
      email: email ? email : null,
    });
    if (data.access_token) {
      setToken(data.access_token);
      location.href = '/play';
    } else {
      // Email given -> must pass the code step on login.
      location.href = '/login?code=1';
    }
  } catch (err) { showMsg('msg', err.message, 'danger'); }
});
</script>
{% endblock %}
