services:
  challenge:
    build: .
    environment:
      CTF_FLAG: ${CTF_FLAG:?Set CTF_FLAG before starting}
    ports:
      - "127.0.0.1:${PORT:-13437}:8080"
    # Позволяет контейнеру достучаться до слушателя на хосте во время
    # локального прогона солвера (игроки эксфильтрируют на свой webhook).
    extra_hosts:
      - "host.docker.internal:host-gateway"
